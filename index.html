<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temas CS2 - Lobby</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">

  <!-- TELA DE LOGIN / BLOQUEIO (Exibida antes de acessar o site) -->
  <div id="login-screen" class="w-full max-w-md bg-slate-800 rounded-xl shadow-2xl p-8 border border-slate-700 text-center">
    <h1 class="text-3xl font-extrabold text-amber-500 mb-2">🎯 CS2 Lobby Themes</h1>
    <p class="text-slate-400 text-sm mb-6">Faça login com sua conta do Google para acessar o sistema.</p>

    <!-- Status / Mensagem de Aguardando Aprovação -->
    <div id="auth-status" class="mb-6"></div>

    <!-- Botão de Login do Google -->
    <button 
      id="btn-login-google" 
      class="w-full bg-white hover:bg-slate-100 text-slate-900 font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-3 transition shadow-md"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Entrar com Google
    </button>

    <!-- Botão de Sair (quando o usuário está logado, mas não aprovado) -->
    <button id="btn-logout" class="hidden w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2 px-4 rounded-lg mt-4 transition">
      Sair da Conta
    </button>
  </div>


  <!-- CONTEÚDO PRINCIPAL DO SITE (Escondido até a aprovação do usuário) -->
  <main id="main-content" class="hidden w-full max-w-2xl bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-700">
      <h1 class="text-2xl font-extrabold text-amber-500 tracking-wide">
        🎯 TEMAS LOBBY CS2
      </h1>
      <button id="btn-logout-main" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium py-1.5 px-3 rounded transition">
        Sair
      </button>
    </div>

    <!-- Painel do Admin (Só exibe para quem é Admin) -->
    <div id="admin-panel" class="hidden mb-6 p-4 bg-slate-900 rounded-lg border border-amber-500/30">
      <h2 class="text-lg font-bold text-amber-400 mb-2">🛡️ Painel do Administrador</h2>
      <p class="text-xs text-slate-400 mb-3">Gerencie as solicitações de acesso ao sistema:</p>
      <ul id="permissions-list" class="space-y-2 max-h-40 overflow-y-auto"></ul>
    </div>

    <!-- Área de Sorteio -->
    <div class="bg-slate-900/80 rounded-lg p-5 mb-6 text-center border border-amber-500/30">
      <div id="drawn-result" class="text-2xl font-bold text-amber-400 min-h-[40px] flex items-center justify-center">
        Clique para sortear um tema!
      </div>
      <button id="btn-draw" class="mt-4 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 px-6 rounded-lg transition duration-200 shadow-lg">
        🎲 Sortear Tema
      </button>
    </div>

    <!-- Formulário para Adicionar Tema -->
    <form id="theme-form" class="flex gap-2 mb-6">
      <input 
        type="text" 
        id="theme-input" 
        placeholder="Digite um novo tema..." 
        required
        class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-amber-500"
      />
      <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-lg transition">
        Adicionar
      </button>
    </form>

    <!-- Lista de Temas -->
    <ul id="theme-list" class="space-y-2 max-h-[450px] overflow-y-auto pr-2"></ul>
  </main>

  <script type="module" src="./src/app.ts"></script>
</body>
</html>
